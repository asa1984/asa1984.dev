name: pre-merge-check

on:
  # Runs for every base branch so that stacked PRs are checked too.
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint / format / typecheck / test を 1 ジョブに集約し parallel steps で
  # 並列実行する(ジョブを分けるとセットアップがジョブ数分かかる)。
  # codegen は生成物を共有するため並列化せず先に 1 回だけ実行する。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run codegen
      - parallel:
          - run: vp lint
          - run: vp fmt --check
          - run: vp run typecheck
          - run: vp run test
          - run: vp run check:actions
          - run: vp run check:knip
          - run: vp run check:ast-grep
          - run: vp run check:files

  # 本番と同じ手順でビルドし、デプロイと同じ静的配信に対して Playwright のテストを実行する。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run codegen
      # Playwright の推奨に従い、ブラウザはキャッシュせず毎回入れる。
      - working-directory: apps/web
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: vp run test:e2e
        env:
          VITE_SITE_URL: https://asa1984.dev

  # main のルールセットが必須にするチェックはこのジョブだけにする。
  # マージの条件にするジョブは needs に並べるので、ジョブの追加や改名で
  # ルールセット (asa1984/infrastructure) を変える必要はない。
  # needs のジョブが失敗するとこのジョブは既定でスキップされ、GitHub は
  # スキップされた必須チェックを成功として扱う。そのため always() で必ず
  # 実行し、needs の結果を見て失敗させる。
  pre-merge-check:
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
