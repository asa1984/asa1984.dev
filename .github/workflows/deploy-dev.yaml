name: deploy-dev

on:
  push:
    paths-ignore:
      - README.md
    branches:
      - main

permissions: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # 検証とデプロイを 1 ジョブに統合してセットアップを 1 回に抑え、
  # 検証ステップは parallel steps で並列実行する。
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run codegen
      - parallel:
          - run: vp lint
          - run: vp fmt --check
          - run: vp run typecheck
          - run: vp run test
      # The only GitHub secret is OP_SERVICE_ACCOUNT_TOKEN; every real
      # credential lives in the 1Password vault "asa1984.dev".
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://asa1984.dev/cloudflare/credential
          CLOUDFLARE_ACCOUNT_ID: op://asa1984.dev/cloudflare/CLOUDFLARE_ACCOUNT_ID
      - run: vp run "@asa1984.dev/web#build"
        env:
          VITE_SITE_URL: https://dev.asa1984.dev
      - run: vp run "@asa1984.dev/web#deploy:dev"
