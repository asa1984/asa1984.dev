name: Release

# Cuts a timestamped release from main and deploys it to production.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: github.ref == 'refs/heads/main'
    # gh CLI を叩くだけの軽量ジョブなので ubuntu-slim (1 vCPU) で足りる
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes

  deploy:
    needs: create-release
    uses: ./.github/workflows/deploy-production.yaml
    secrets: inherit
