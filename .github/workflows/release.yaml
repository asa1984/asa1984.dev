name: Release

# Cuts a timestamped release from main and deploys it to production.
on:
  workflow_dispatch:

permissions: {}

jobs:
  create-release:
    if: github.ref == 'refs/heads/main'
    # The job only calls the gh CLI, so ubuntu-slim (1 vCPU) is enough.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes

  deploy:
    needs: create-release
    uses: ./.github/workflows/deploy-production.yaml
    permissions:
      contents: read
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
