name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - README.md
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: nix develop .#ci --command pnpm run lint
      - name: Format check
        run: nix develop .#ci --command pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Typecheck
        run: nix develop .#ci --command pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test
        run: nix develop .#ci --command pnpm run test

  workers-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Generate
        run: nix develop .#ci --command pnpm run gen
      # Bundle-size budgets + workerd smoke over the production bundling
      # path (opennextjs-cloudflare), which a plain `next build` never
      # exercises — see issue #31.
      - name: Check worker bundles
        run: nix develop .#ci --command scripts/workers-check.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: nix develop .#ci --command pnpm run build
        env:
          # The smoke build has no backend to fetch content from
          ALLOW_EMPTY_CONTENT: "1"
