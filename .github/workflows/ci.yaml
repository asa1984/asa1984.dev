name: CI

on:
  pull_request:
    # Runs for every base branch so that stacked PRs are checked too.
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint / format / typecheck / test を 1 ジョブに集約し parallel steps で
  # 並列実行する(ジョブを分けるとセットアップがジョブ数分かかる)。
  # codegen は生成物を共有するため並列化せず先に 1 回だけ実行する。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Codegen
        run: pnpm exec vp run codegen
      - parallel:
          - name: Lint
            run: pnpm exec vp lint
          - name: Format check
            run: pnpm exec vp fmt --check
          - name: Typecheck
            run: pnpm exec vp run typecheck
          - name: Test
            run: pnpm exec vp run test
          - name: Check workflows
            run: pnpm exec vp run check:actions

  # Bundle-size budgets + workerd smoke over the production bundling
  # path (opennextjs-cloudflare), which a plain `next build` never
  # exercises — see issue #31. 素の `next build` はこのビルドに包含される
  # ため独立した build ジョブは持たない。
  workers-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Codegen
        run: pnpm exec vp run codegen
      - name: Check worker bundle
        run: scripts/workers-check.sh

  # With squash merges, the PR title becomes the commit subject.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix profile add .#ci
      # Inside a git repository, cog reads user.name from the git config, which the runner does not set.
      - run: cog verify "$PR_TITLE"
        working-directory: ${{ runner.temp }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
