name: CI

on:
  # Runs for every base branch so that stacked PRs are checked too.
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint / format / typecheck / test を 1 ジョブに集約し parallel steps で
  # 並列実行する(ジョブを分けるとセットアップがジョブ数分かかる)。
  # codegen は生成物を共有するため並列化せず先に 1 回だけ実行する。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Codegen
        run: pnpm exec vp run codegen
      - parallel:
          - name: Lint
            run: pnpm exec vp lint
          - name: Format check
            run: pnpm exec vp fmt --check
          - name: Typecheck
            run: pnpm exec vp run typecheck
          - name: Test
            run: pnpm exec vp run test
          - name: Check workflows
            run: pnpm exec vp run check:actions

  # 本番と同じ手順で全ページをプリレンダーし、デプロイと同じ静的配信で
  # 主要なパスの応答を確かめる。
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Codegen
        run: pnpm exec vp run codegen
      - name: Check the static build
        run: scripts/build-check.sh

  # main のルールセットが必須にするチェックはこのジョブだけにする。
  # マージの条件にするジョブは needs に並べるので、ジョブの追加や改名で
  # ルールセット (asa1984/infrastructure) を変える必要はない。
  # needs のジョブが失敗するとこのジョブは既定でスキップされ、GitHub は
  # スキップされた必須チェックを成功として扱う。そのため always() で必ず
  # 実行し、needs の結果を見て失敗させる。
  pre-merge-check:
    if: always()
    needs: [checks, build-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
