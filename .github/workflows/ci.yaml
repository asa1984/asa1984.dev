name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - README.md
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: nix develop .#ci --command pnpm run lint
      - name: Format check
        run: nix develop .#ci --command pnpm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Typecheck
        run: nix develop .#ci --command pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: nix develop .#ci --command pnpm run build
        env:
          # The smoke build has no backend to fetch content from
          ALLOW_EMPTY_CONTENT: "1"
