name: Deploy (production)

on:
  # Manual releases (`gh release create release-...`) trigger this directly.
  # Releases cut by the Release workflow use the workflow_call path instead,
  # because events created with the workflow's own GITHUB_TOKEN never start
  # new workflow runs.
  release:
    types: [published]
  workflow_call:
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

permissions: {}

jobs:
  deploy:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'release-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://asa1984.dev/cloudflare/credential
          CLOUDFLARE_ACCOUNT_ID: op://asa1984.dev/cloudflare/CLOUDFLARE_ACCOUNT_ID
      - name: Codegen
        run: pnpm exec vp run codegen
      - name: Build
        run: pnpm exec vp run "@asa1984.dev/web#build"
        env:
          VITE_SITE_URL: https://asa1984.dev
      - name: Deploy to production
        run: pnpm exec vp run "@asa1984.dev/web#deploy:production"
