name: Deploy (production)

on:
  # Manual releases (`gh release create release-...`) trigger this directly.
  # Releases cut by the Release workflow use the workflow_call path instead,
  # because events created with the workflow's own GITHUB_TOKEN never start
  # new workflow runs.
  release:
    types: [published]
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'release-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://asa1984.dev/cloudflare/credential
          CLOUDFLARE_ACCOUNT_ID: op://asa1984.dev/cloudflare/CLOUDFLARE_ACCOUNT_ID
          CONTENT_GITHUB_TOKEN: op://asa1984.dev/production/CONTENT_GITHUB_TOKEN
          CONTENT_WEBHOOK_SECRET: op://asa1984.dev/content-webhook-secret/password
      - name: Codegen
        run: pnpm exec vp run codegen
      - name: Build worker
        run: pnpm exec vp run "@asa1984.dev/frontend#build:worker"
        env:
          FRONTEND_URL: https://asa1984.dev
      - name: Deploy to production
        run: pnpm exec vp run "@asa1984.dev/frontend#deploy:production"
      - name: Sync worker secrets
        run: pnpm exec vp run "@asa1984.dev/frontend#secret:production"
