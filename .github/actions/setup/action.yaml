name: Setup
description: Setup tools and runs pnpm install

runs:
  using: composite
  steps:
    - name: Setup Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
    - name: Setup Nix binary cache
      uses: asa1984/ci-binary-cache-action@421b2c4599cbff03e101af7118404bf2ddb120b0 # fix/packages-input-typo
      with:
        packages: .#ci
    # Install the CI tools into the profile and call them directly from later steps,
    # instead of wrapping each step in `nix develop --command`.
    - name: Install CI toolchain
      shell: bash
      run: nix profile add .#ci
    - name: Setup corepack
      shell: bash
      run: corepack install
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
