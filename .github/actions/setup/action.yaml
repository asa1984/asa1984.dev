name: Setup
description: Setup tools and runs pnpm install

runs:
  using: composite
  steps:
    - name: Setup Nix
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - name: Setup Nix binary cache
      uses: asa1984/ci-binary-cache-action@2e5da24c1a08c6a30fdeea86e229209bf7c29f2a # fix/packages-input-typo (PR #1)
      with:
        packages: .#ci
    # devShell を都度 `nix develop --command` で包む代わりに、CI ツール一式を
    # profile に入れて以降のステップから直接呼ぶ。
    - name: Install CI toolchain
      shell: bash
      run: |
        nix profile install .#ci
        echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
    - name: Setup corepack
      shell: bash
      run: corepack install
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
